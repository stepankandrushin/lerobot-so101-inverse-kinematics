# The C library in double, float and float without the point cache, the C example, the Python
# binding built and run without an arm (a fast run planned, and driven on simulated servos), and the
# sdist and a wheel built from it, on Linux and macOS.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0     # setup-uv publishes full versions only, no v10 tag
      - run: make test
      - run: make example
      - run: uv sync
      - run: uv run examples/kinematics.py
      - run: uv run examples/figures/heart.py --dry
      - run: SO101_PORT=sim uv run examples/figures/heart.py --speed 0.85 --name ci-heart    # on simulated servos
      - run: uv build
